<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIOME — Baseline-Individualized Onboard Microbiome Evaluation</title>
<meta name="description" content="BIOME: offline-capable individualized longitudinal vaginal microbiome monitoring and explainable decision support for female astronauts. NASA Space Apps Challenge 2026 research prototype.">
<style>
:root{
  --bg:#060a13;--bg2:#0a1020;--panel:#0e1526;--panel2:#121b30;--line:#1f2c46;--line2:#2a3a5a;

  --baseline:#8fa3c4;--stable:#3ecf8e;--watch:#f5c542;--monitor:#ff9347;--review:#e45fae;--urgent:#ff4d4f;
  --radius:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
body{background:radial-gradient(1200px 600px at 80% -10%,#12234a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0d3b4a44,transparent 60%),var(--bg);min-height:100vh}
a{color:var(--accent2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#nav{border-right:1px solid var(--line);background:linear-gradient(180deg,#0b1222,#080d19);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:2px 6px 4px}
.brand svg{flex:none}
.brand h1{font-size:20px;letter-spacing:.24em;margin:0;font-weight:800}
.brandsub{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.02em;line-height:1.3;margin:6px 6px 16px}
#nav button.nav{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13.5px}
#nav button.nav:hover{background:#ffffff08;color:var(--text)}
#nav button.nav.on{background:linear-gradient(90deg,#4fd1c51f,#4fd1c505);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
#nav .navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:14px 10px 4px}
#nav .ico{width:18px;text-align:center;opacity:.8}
.selftest-pill{margin:16px 6px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);background:var(--panel)}
main{min-width:0}
#topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);background:#070c18cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
#topbar .grp{display:flex;gap:8px;align-items:center}
#topbar label{color:var(--muted);font-size:12px}
.daybox{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.daybox span{padding:6px 12px;font-family:var(--mono);font-size:13px;min-width:132px;text-align:center}
.daybox button{background:var(--panel2);border:0;padding:6px 10px;cursor:pointer;color:var(--text)}
.daybox button:hover{background:#1b2742}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--accent);color:#04201d;font-weight:700}
.simpill{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--watch);color:var(--watch);padding:4px 10px;border-radius:999px}
#urgent{display:none}
#urgent.show{display:flex;gap:14px;align-items:center;background:repeating-linear-gradient(135deg,#3a0b0f,#3a0b0f 14px,#4a0d12 14px,#4a0d12 28px);border-bottom:2px solid var(--urgent);padding:12px 22px}
#urgent strong{color:#fff;font-size:15px}
#view{padding:22px;max-width:1360px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px;letter-spacing:.01em}
h4{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.sub{color:var(--muted);margin:0 0 18px;max-width:900px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.card{background:linear-gradient(180deg,var(--panel),#0c1322);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.tight{padding:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}
.small{font-size:12px}.tiny{font-size:11px}
.big{font-size:28px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--text);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04201d;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:#ff4d4f88;color:#ffb3b4}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{background:#0a1121;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:62px;resize:vertical}
input[type=number]{width:96px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--text);font-size:13px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:#0b1222;position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
.tablewrap table th:first-child,.tablewrap table td:first-child{padding-left:12px}
tr.sel td{background:#4fd1c512}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff06}
.state{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12.5px;border:1px solid;white-space:nowrap}
.state .shape{font-size:11px}
.s-baseline{color:var(--baseline);border-color:#8fa3c466;background:#8fa3c414}
.s-stable{color:var(--stable);border-color:#3ecf8e66;background:#3ecf8e14}
.s-watch{color:var(--watch);border-color:#f5c54266;background:#f5c54214}
.s-monitor{color:var(--monitor);border-color:#ff934766;background:#ff934714}
.s-review{color:var(--review);border-color:#e45fae66;background:#e45fae14}
.s-urgent{color:#fff;border-color:var(--urgent);background:#ff4d4f33}
.statecard{border-left:4px solid var(--line2)}
.statecard.s-stable{border-left-color:var(--stable)}.statecard.s-watch{border-left-color:var(--watch)}.statecard.s-monitor{border-left-color:var(--monitor)}.statecard.s-review{border-left-color:var(--review)}.statecard.s-baseline{border-left-color:var(--baseline)}
.statecard.s-stable,.statecard.s-watch,.statecard.s-monitor,.statecard.s-review,.statecard.s-baseline{color:var(--text);background:linear-gradient(180deg,var(--panel),#0c1322)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);white-space:nowrap}
.tag.rule{color:var(--accent);border-color:#4fd1c555}
.tag.ev-pub{color:#9fe0b0;border-color:#3ecf8e55}.tag.ev-stat{color:#a9c1ff;border-color:#7aa2ff55}.tag.ev-assume{color:#ffd27a;border-color:#f5c54255}.tag.ev-sim{color:#f0a3d0;border-color:#e45fae55}
.qc-valid{color:var(--stable)}.qc-blq{color:var(--watch)}.qc-nd{color:var(--baseline)}.qc-qcfail{color:var(--urgent)}.qc-missing{color:var(--dim)}
.sig-high{color:var(--monitor);font-weight:700}.sig-low{color:var(--accent2);font-weight:700}
.notice{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;background:#0c1426;margin-bottom:10px}
.notice.warn{border-color:#f5c54266;background:#f5c5420d}
.notice.bad{border-color:#ff4d4f77;background:#ff4d4f12}
.notice.ok{border-color:#3ecf8e55;background:#3ecf8e0d}
.notice.info{border-color:#7aa2ff55;background:#7aa2ff0d}
.notice b{white-space:nowrap}
.loglist{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto}
.loglist li{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:62px 54px 1fr;gap:8px;font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:#1d2942;stroke-width:1}
.chart .tick{fill:#6f7f9c;font-size:10.5px;font-family:var(--mono)}
.chart .launch{stroke:#7aa2ff;stroke-dasharray:3 4;opacity:.7}
.chart .band{fill:#4fd1c514;stroke:#4fd1c555;stroke-dasharray:4 3}
.chart .mean{stroke:#4fd1c5aa;stroke-dasharray:6 4}
.chart .ref{stroke:#f5c542aa;stroke-dasharray:5 4}
.chart .pt{cursor:pointer}
.chart .inv{stroke:var(--urgent);stroke-width:2}
.chart .axl{fill:#8d9cb8;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:#0b1222f2;border:1px solid var(--line2);padding:6px 9px;border-radius:8px;font-size:12px;z-index:100;display:none;max-width:320px;white-space:pre-line}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:10px;max-width:420px;box-shadow:0 8px 30px #0008;font-size:13px}
.symgrid{display:grid;grid-template-columns:170px repeat(4,1fr);gap:6px;align-items:center}
.radio-seg{display:flex;gap:0}
.radio-seg label{flex:1}
.radio-seg input{position:absolute;opacity:0}
.radio-seg span{display:block;text-align:center;padding:6px 4px;border:1px solid var(--line2);cursor:pointer;font-size:12.5px;color:var(--muted)}
.radio-seg label:first-child span{border-radius:8px 0 0 8px}.radio-seg label:last-child span{border-radius:0 8px 8px 0}
.radio-seg input:checked+span{background:#4fd1c522;color:var(--text);border-color:var(--accent)}
.radio-seg input:focus-visible+span{outline:2px solid var(--accent)}
.redbox{border:1px solid #ff4d4f77;background:#ff4d4f0c;border-radius:10px;padding:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0}
.meter{height:8px;border-radius:99px;background:#1a243b;overflow:hidden}
.meter>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.meter.low>div{background:linear-gradient(90deg,var(--watch),var(--urgent))}
.strip{display:flex;height:16px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.taskitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.taskitem:last-child{border-bottom:0}
.pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.formula{font-family:var(--mono);background:#0a1121;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;white-space:pre-wrap;font-size:12.5px;color:#cfe9ff}
details>summary{cursor:pointer;color:var(--accent2);font-size:12.5px;margin-top:8px}
.progress{height:6px;background:#1a243b;border-radius:99px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--accent);width:0}
.astro-card{cursor:pointer;transition:border-color .15s}
.astro-card:hover{border-color:var(--accent)}
.astro-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
pre.report{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#0a1121;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:480px;overflow:auto}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.sr{position:absolute;left:-9999px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #nav{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
  #nav .navgrp,.brandsub,.selftest-pill{display:none}
  #nav button.nav{width:auto;white-space:nowrap}
  .brand{margin-right:10px}
  .g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
  .symgrid{grid-template-columns:1fr}
  #topbar{position:static}
  .simpill{margin-left:0}
}
@media print{#nav,#topbar,#toast{display:none}#app{display:block}body{background:#fff;color:#000}}
</style>

<div id="app">

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const VERSION = '0.9.0-hackathon';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || (typeof v === 'string' && v.trim() === '') || isNaN(+v)) ? null : +v;
const fmt = (x, d = 2) => (x == null || !isFinite(x)) ? '—' : Number(x).toFixed(d);
const fmtP = p => p == null ? '—' : (p < 0.0001 ? '<0.0001' : p.toFixed(4));
const fmtFold = f => f == null ? '—' : f >= 1 ? (f < 10 ? f.toFixed(1) : Math.round(f).toLocaleString('en-US')) + '×' : (1 / f < 10 ? (1 / f).toFixed(1) : Math.round(1 / f).toLocaleString('en-US')) + '-fold lower';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const uniq = a => [...new Set(a)];
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function addDays(iso, d) { const t = new Date(iso + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + d); return t.toISOString().slice(0, 10); }

/* ---------- statistics ---------- */
function lnGamma(z) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

  const t = z + 7.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
function betacf(a, b, x) {
  const MAXIT = 300, EPS = 3e-15, FPMIN = 1e-300;
  const qab = a + b, qap = a + 1, qam = a - 1; let c = 1, d = 1 - qab * x / qap;

  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < EPS) break;
  }

function ibeta(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lnGamma(a + b) - lnGamma(a) - lnGamma(b) + a * Math.log(x) + b * Math.log(1 - x));

/** Student's t cumulative distribution function */
function tCDF(t, df) { const x = df / (df + t * t); const p = 0.5 * ibeta(df / 2, 0.5, x); return t >= 0 ? 1 - p : p; }

/** Holm (1979) step-down, family = targets in one test panel */
function holm(ps, alpha) {

  s.forEach((e, i) => {

/* ---------- domain constants ---------- */
const TARGETS = [
  { key: 'Lcr', name: 'L. crispatus', full: 'Lactobacillus crispatus', domain: 'protective' },
  { key: 'Ljen', name: 'L. jensenii', full: 'Lactobacillus jensenii', domain: 'protective' },
  { key: 'Lgas', name: 'L. gasseri', full: 'Lactobacillus gasseri', domain: 'protective' },
  { key: 'Lin', name: 'L. iners', full: 'Lactobacillus iners', domain: 'iners' },
  { key: 'Gva', name: 'G. vaginalis', full: 'Gardnerella vaginalis', domain: 'bv' },
  { key: 'Fva', name: 'F. vaginae', full: 'Fannyhessea (Atopobium) vaginae', domain: 'bv' },
  { key: 'Meg', name: 'Megasphaera spp.', full: 'Megasphaera species', domain: 'bv' },

/* =====================================================================
   QUALITY CONTROL  (§7)
   ===================================================================== */
function qcTest(test, cfg) {
  const assay = ASSAYS[test.assay]; const lot = assay && assay.lots[test.lot];
  const reasons = [], warnings = []; let valid = true;
  if (!lot) { valid = false; reasons.push('Required assay/calibration information is missing — calibrated abundance not calculated.'); }
  if (test.ntc === 'amplified') { valid = false; reasons.push('No-template control amplified beyond assay acceptance criteria — run rejected (possible contamination).'); }
  if (test.pc === 'fail') { valid = false; reasons.push('Positive control failed its acceptance criteria — run rejected.'); }
  const hsc = num(test.hscCq);
  if (lot) {
    if (hsc == null) { valid = false; reasons.push('Human sample control not amplified — sample adequacy not established; sample rejected.'); }
    else if (hsc > lot.hsc.maxCq) { valid = false; reasons.push(`Human sample control failed (Cq ${fmt(hsc)} > assay criterion ${lot.hsc.maxCq}) — sample adequacy not established; sample rejected.`); }
  }
  if (test.iac === 'fail') { valid = false; reasons.push('Internal amplification control failed — amplification failure; run rejected.'); }
  if (test.iac === 'inhibited') { if (cfg.iacPolicy === 'flag') warnings.push('Internal amplification control indicates inhibition — flagged per configured assay policy.'); else { valid = false; reasons.push('Internal amplification control indicates PCR inhibition — rejected per assay validation policy.'); } }
  const targets = {};
  TARGETS.forEach(t => {
    const e = (test.targets || {})[t.key] || {}; const cv = lot && lot.curves[t.key];
    const cq = num(e.cq), xin = num(e.log10); const o = { status: 'missing', x: null, cq, xin, xcq: null, note: '' };
    if (cv) { o.lod = cv.lod; o.loq = cv.loq; o.uloq = cv.uloq; }
    if (!valid) { o.status = 'qcfail'; o.note = 'Run/sample QC failure'; targets[t.key] = o; return; }
    const st = e.status || (cq != null || xin != null ? 'detected' : 'missing');
    if (st === 'missing') { o.note = 'Target not run'; }
    else if (st === 'nd') { o.status = 'nd'; o.note = 'Below detection limit — recorded as not detected, not zero'; }
    else {
      const xcq = cq != null ? (cq - cv.b) / cv.m : null; o.xcq = xcq;
      if (xcq != null && xin != null && Math.abs(xcq - xin) > cfg.cqTol) { o.status = 'qcfail'; o.note = `Cq and quantified abundance are inconsistent under ${test.lot} (Cq→${fmt(xcq)} vs entered ${fmt(xin)} log10)`; }
      else {
        const x = xcq ?? xin;
        if (x == null) { o.note = 'Detected but no Cq or abundance entered'; }
        else if (x < cv.lod) { o.status = 'nd'; o.note = 'Below assay detection limit — not detected, not zero'; }
        else if (x < cv.loq) { o.status = 'blq'; o.x = x; o.note = 'Detected, not reliably quantifiable'; }
        else if (x > cv.uloq) { o.status = 'qcfail'; o.x = x; o.note = 'Above validated linear range'; }
        else { o.status = 'valid'; o.x = x; }
      }
    }
    targets[t.key] = o;
  });
  return { valid, reasons, warnings, targets };
}

/* =====================================================================
   BASELINE  (§8)
   ===================================================================== */
function computeBaseline(astro, cfg) {
  const tests = astro.tests.filter(t => t.day < 0);
  const qcs = tests.map(t => ({ t, q: qcTest(t, cfg) }));
  const validRuns = qcs.filter(o => o.q.valid);
  const targets = {}; const warnings = [];
  TARGETS.forEach(t => {
    const xs = validRuns.filter(o => o.q.targets[t.key].status === 'valid').map(o => o.q.targets[t.key].x);
    const det = validRuns.filter(o => ['valid', 'blq'].includes(o.q.targets[t.key].status)).length;
    const st = xs.length ? meanSd(xs) : { n: 0, mean: null, sd: null };
    const b = { ...st, min: xs.length ? Math.min(...xs) : null, max: xs.length ? Math.max(...xs) : null, detFrac: validRuns.length ? det / validRuns.length : 0, sufficient: st.n >= cfg.baselineMin && st.sd > 0, provisional: st.n < cfg.baselineMin * 1.5, highVar: st.sd > cfg.highVarSd };
    targets[t.key] = b;
    if (b.highVar) warnings.push(`${t.name}: highly variable baseline (SD ${fmt(st.sd)} log10) — review.`);
  });
  const protMax = Math.max(...PROT.map(k => targets[k].mean ?? -Infinity));
  const bvMax = Math.max(...BV.map(k => targets[k].mean ?? -Infinity), targets.Lin.mean ?? -Infinity);
  if (validRuns.length && protMax < bvMax) warnings.push('Non-Lactobacillus-dominated (or L. iners-dominated) baseline — flagged for review, not classified as abnormal.');
  const nSuff = TARGETS.filter(t => targets[t.key].sufficient).length;
  if (nSuff === 0) warnings.push(`No target has ≥ ${cfg.baselineMin} valid quantifiable observations yet.`);
  return { targets, nSamples: tests.length, nValidRuns: validRuns.length, warnings, nSufficient: nSuff, computedAt: new Date().toISOString(), cfgMin: cfg.baselineMin };
}

/* =====================================================================
   LONGITUDINAL ANALYSIS  (§9)
   ===================================================================== */
function analyzeTest(qc, bl, cfg) {
  const per = {}; const ps = [];
  TARGETS.forEach(t => {
    const q = qc.targets[t.key]; const b = bl.targets[t.key]; const r = { key: t.key, status: q.status, x: q.x, quant: false, signal: null };
    if (b) { r.mean = b.mean; r.sd = b.sd; r.n = b.n; }
    if (q.status === 'valid' && b && b.sufficient) {
      const se = b.sd * Math.sqrt(1 + 1 / b.n), df = b.n - 1, tc = tInv(1 - cfg.alpha / 2, df);
      r.t = (q.x - b.mean) / se; r.df = df; r.p = 2 * (1 - tCDF(Math.abs(r.t), df));
      r.lo = b.mean - tc * se; r.hi = b.mean + tc * se; r.diff = q.x - b.mean; r.fold = Math.pow(10, r.diff);
      r.outside = q.x < r.lo ? 'low' : q.x > r.hi ? 'high' : null; r.quant = true; ps.push({ key: t.key, p: r.p });
    } else {
      r.reason = q.status !== 'valid' ? QC_LABEL[q.status] + ' — no quantitative comparison' : 'Insufficient baseline — not suitable for quantitative trend analysis';
    }
    if (b) {
      if (q.status === 'nd' && b.detFrac >= 0.5) r.transition = 'Detected at baseline → not detected now (qualitative)';
      if ((q.status === 'valid' || q.status === 'blq') && b.detFrac < 0.5) r.transition = 'Mostly not detected at baseline → detected now (qualitative)';
    }
    per[t.key] = r;
  });
  const h = holm(ps, cfg.alpha);
  Object.entries(h.res).forEach(([k, v]) => { Object.assign(per[k], { padj: v.padj, holmThr: v.thr, holmRank: v.rank, rejected: v.rejected }); if (v.rejected) per[k].signal = per[k].t > 0 ? 'high' : 'low'; });
  return { per, m: h.m };
}

/* =====================================================================
   PATTERN INTERPRETATION  (§10)
   ===================================================================== */
function classify(an, cfg) {
  const sig = k => an.per[k] && an.per[k].signal;
  const bvUp = BV.filter(k => sig(k) === 'high'), protDown = PROT.filter(k => sig(k) === 'low'), protUp = PROT.filter(k => sig(k) === 'high');
  const signals = TARGETS.filter(t => t.key !== 'Cand' && sig(t.key)).map(t => t.key);
  let primary = 'stable';
  if (bvUp.length >= cfg.bvMinElevated && protDown.length >= cfg.protMinReduced) primary = 'bvlike';
  else if (bvUp.length) primary = 'bvinc';
  else if ((protUp.length || sig('Lin') === 'high') && !protDown.length && signals.every(k => sig(k) === 'high' && ['Lcr', 'Ljen', 'Lgas', 'Lin', 'T16S'].includes(k))) primary = 'lactoenrich';
  else if (signals.length === 1 && signals[0] === 'T16S') primary = 'loadshift';
  else if (signals.length) primary = 'mixed';
  const candida = sig('Cand') === 'high' ? 'increase' : sig('Cand') === 'low' ? 'decrease' : (an.per.Cand && an.per.Cand.transition && an.per.Cand.transition.includes('detected now') ? 'newly-detected' : null);
  return { primary, candida, bvUp, protDown, protUp, signals };
}

   PERSISTENCE — IndexedDB (§14.1)
   ===================================================================== */
const DB = {
  db: null, mem: null,
  open() { return new Promise(res => { try { const rq = indexedDB.open('biome-db', 1); rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('astronauts', { keyPath: 'id' }); d.createObjectStore('meta'); }; rq.onsuccess = () => { this.db = rq.result; res(true); }; rq.onerror = () => { this.mem = { astronauts: {}, meta: {} }; res(false); }; } catch (e) { this.mem = { astronauts: {}, meta: {} }; res(false); } }); },
  req(store, mode, fn) { if (this.mem) return Promise.resolve(fn(null)); return new Promise((res, rej) => { const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  all(store) { if (this.mem) return Promise.resolve(Object.values(this.mem[store])); return this.req(store, 'readonly', s => s.getAll()); },
  get(store, key) { if (this.mem) return Promise.resolve(this.mem[store][key]); return this.req(store, 'readonly', s => s.get(key)); },
  put(store, val, key) { const v = JSON.parse(JSON.stringify(val)); if (this.mem) { this.mem[store][key ?? v.id] = v; return Promise.resolve(); } return this.req(store, 'readwrite', s => key !== undefined ? s.put(v, key) : s.put(v)); },
  del(store, key) { if (this.mem) { delete this.mem[store][key]; return Promise.resolve(); } return this.req(store, 'readwrite', s => s.delete(key)); },
  clear(store) { if (this.mem) { this.mem[store] = {}; return Promise.resolve(); } return this.req(store, 'readwrite', s => s.clear()); },
};
